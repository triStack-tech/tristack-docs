site_name: TriStack Docs
# Canonical URLs and the sitemap are built from this, so it has to be a name that
# actually resolves. Switching to https://docs.tristack.tech/ needs two things done
# in this order: a DNS CNAME for docs -> tristack-tech.github.io, then a docs/CNAME
# file holding that hostname. Change this line at the same time as adding the CNAME.
site_url: https://tristack-tech.github.io/tristack-docs/
site_description: >-
  Developer documentation for TriStack products, starting with Manifold: one HTTP API
  for language models, metered per token and billed from a prepaid wallet.
site_author: Tristack Technologies LLP
copyright: >-
  Tristack Technologies LLP (LLPIN ACP-3743), B-35, Vinoba Kunj Apartments,
  Sector 9, Rohini, Delhi 110085, India.

docs_dir: docs
site_dir: site

theme:
  name: material
  language: en
  logo: assets/wordmark.svg
  favicon: assets/favicon.ico
  # Setting this to false stops the theme pulling webfonts from a third-party host on
  # every page load, which would put an outside vendor in the shipped HTML and hand it
  # every reader's IP address. The system font stack is used instead.
  font: false
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Follow the system theme
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.tooltips

extra_css:
  - stylesheets/extra.css

extra:
  generator: false
  social:
    - icon: material/web
      link: https://tristack.tech
      name: tristack.tech
    - icon: material/api
      link: https://api.tristack.tech
      name: api.tristack.tech
    - icon: material/email-outline
      link: mailto:support@tristack.tech
      name: support@tristack.tech

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
      permalink_title: Link to this section
      title: On this page
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.snippets:
      base_path:
        - includes
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# Product sections sit at the top level so another TriStack product slots in beside
# Manifold without moving any of these pages.
nav:
  - Home: index.md
  - Manifold:
      - Getting started: getting-started.md
      - Guides:
          - Authentication: guides/authentication.md
          - Streaming: guides/streaming.md
          - Vision and images: guides/vision.md
      - API reference:
          - Overview: api/index.md
          - Create a message: api/messages.md
          - List models: api/models.md
          - Errors: api/errors.md
          - Dashboard API: api/dashboard.md
      - Models and pricing:
          - Model catalog: pricing/models.md
          - Pricing and billing: pricing/billing.md
  - Support: support.md
  - Changelog: changelog.md
