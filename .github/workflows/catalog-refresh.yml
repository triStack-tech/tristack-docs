# Keeps the published prices honest without anyone remembering to do it.
#
# Once a week this captures GET /v1/manifold/models, regenerates the pricing tables, and
# opens a pull request describing exactly what moved. When the catalog has not changed it
# opens nothing and says so in the run summary.
#
# The key comes from the TRISTACK_CATALOG_API_KEY repository secret:
#   Settings > Secrets and variables > Actions > New repository secret
#   Name:  TRISTACK_CATALOG_API_KEY
#   Value: an API key from the dashboard
# Without it the run stops on the first step with that instruction, before anything is
# written, rather than half-writing a capture.
#
# The tables are generated as snippets/*.mdx and imported by the pages that show them, so
# a price on a page cannot drift from the catalog it was captured from.
#
# Everything is checked here, before the pull request is opened, because a pull request
# opened with the workflow token does not start another workflow: docs.yml will not run on
# it, so the checks have to happen in this job for the branch to be known good. The one
# exception is the last step, and its comment says why.

name: Catalog refresh

on:
  schedule:
    # Mondays, 06:17 UTC. Off the hour so it is not queued behind everyone else's job.
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: catalog-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh the pricing tables
    # A fork inherits the schedule but not the secret, so it would fail every Monday.
    if: github.repository == 'tristack-tech/tristack-docs'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Require the catalog key
        env:
          TRISTACK_API_KEY: ${{ secrets.TRISTACK_CATALOG_API_KEY }}
        run: |
          # Checked here rather than left to the fetch, so the instruction lands in the run
          # summary where somebody looking at a red Monday will actually read it.
          if [ -z "$TRISTACK_API_KEY" ]; then
            {
              echo "### The catalog key is missing"
              echo
              echo "This workflow needs the \`TRISTACK_CATALOG_API_KEY\` repository secret,"
              echo "holding an API key from the dashboard. Add it under"
              echo "Settings > Secrets and variables > Actions > New repository secret,"
              echo "then run this workflow again from the Actions tab."
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          # No pip cache and no install step: everything under tools/ is standard library
          # only.

      - uses: actions/setup-node@v4
        # For `mint broken-links`.
        with:
          node-version: "20"

      - name: Keep the committed catalog to compare against
        run: cp data/models.json "$RUNNER_TEMP/models.before.json"

      - name: Capture the catalog
        env:
          TRISTACK_API_KEY: ${{ secrets.TRISTACK_CATALOG_API_KEY }}
        run: python tools/fetch_catalog.py --out data/models.json

      - name: Regenerate the pricing tables
        id: generate
        run: python tools/generate_pricing.py

      - name: Explain a rejected catalog
        if: failure() && steps.generate.outcome == 'failure'
        run: |
          {
            echo "### The generator rejected the new catalog"
            echo
            echo "It carries something \`tools/generate_pricing.py\` does not map yet."
            echo "A new alias needs a family in \`FAMILIES\`, and a decision on whether it"
            echo "belongs in \`VISION_ALIASES\` or \`PENDING_ALIASES\`. Add it there, then"
            echo "run this workflow again."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Say what moved
        id: diff
        run: python tools/catalog_diff.py "$RUNNER_TEMP/models.before.json" data/models.json

      - name: Stop here when the catalog has not moved
        if: steps.diff.outputs.changed != 'true'
        run: |
          # A table that changed without the summary noticing would mean the summary is
          # blind to a field the pages use, and blind is worse than wrong here.
          if ! git diff --quiet -- snippets/; then
            echo "The tables changed but the summary reported nothing:" >&2
            git diff -- snippets/ >&2
            exit 1
          fi
          echo "The catalog has not moved. No pull request opened." >> "$GITHUB_STEP_SUMMARY"

      - name: Check the generated tables against the catalog
        if: steps.diff.outputs.changed == 'true'
        run: python tools/verify_snippets.py --tables

      - name: Check the Mintlify docs for broken links
        # The site-wide check. `mint@latest` on purpose: the CLI tracks the hosted renderer,
        # and a pinned copy would drift from what actually publishes. Pin it here if a
        # release ever breaks us.
        if: steps.diff.outputs.changed == 'true'
        run: npx --yes mint@latest broken-links

      - name: Push the refreshed tables to a branch
        # A BRANCH, not a pull request, and the difference is a permission rather than a
        # preference. Opening a PR from a workflow needs "Allow GitHub Actions to create and
        # approve pull requests", which is off on this repository; with it off,
        # create-pull-request fails after every check has already passed, and a week's prices
        # go unpublished for a reason that has nothing to do with the prices.
        #
        # Pushing a branch needs only the `contents: write` this job already has. The review
        # step is unchanged: nothing reaches main until a human merges this branch, and the
        # summary below says exactly what moved. Turn that setting on and this can go back to
        # opening the PR itself.
        if: steps.diff.outputs.changed == 'true'
        env:
          TITLE: ${{ steps.diff.outputs.title }}
          BODY: ${{ steps.diff.outputs.body }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # The capture and everything generated from it, and nothing else. Spelled out
          # rather than `git add -A`, so a stray file written by a tool cannot ride along
          # into a commit that claims to be a price refresh.
          git add data/models.json snippets/
          [ -d includes ] && git add includes/ || true

          git commit -m "$TITLE" -m "$BODY"

          # Force, because this branch is regenerated from scratch every run and carries no
          # history worth keeping: an unmerged refresh from last week is superseded by this
          # one, not something to rebase onto.
          git push --force origin HEAD:catalog-refresh

          {
            echo "### Pushed to \`catalog-refresh\`"
            echo
            echo "$TITLE"
            echo
            echo "Open a pull request from that branch to publish it:"
            echo "https://github.com/${GITHUB_REPOSITORY}/compare/main...catalog-refresh?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check the pages still import the generated tables
        # Deliberately last, and deliberately runs even when the catalog has not moved. A
        # page that stopped importing a table is a documentation bug, not a bad capture,
        # and it must not be the reason a week's prices went unpublished. It still fails
        # the run, so it is not something anyone has to remember to go looking for.
        if: always()
        run: python tools/verify_snippets.py --imports
